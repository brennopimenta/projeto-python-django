{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Django 2 - Index</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <div style="text-align: center;">
            <h1>Django 2 - Index</h1>

    <img src="{% static 'images/django.png' %}">

    <h2>{{ curso }}</h2>

    <h2>{{ outro }}</h2>

    <table>
        <thead>
        <tr>
            <th>Produto</th>
            <th>Preço</th>
        </tr>
        </thead>
        <tbody>
            {% for produto in produtos %}
                <tr>
                    <td><a href="{% url 'produto' produto.id %}">{{ produto.nome }}</a> </td>
                     <td>{{ produto.preco }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
<button onclick="teste();">Clique Me</button>
    </div>



<script type="text/javascript" src="{% static 'js/script.js' %}"></script>
</body>
</html>
